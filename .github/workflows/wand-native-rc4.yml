name: Wand Native RC4 crypt32 build

on:
  push:
    branches:
      - wand-native-rc4-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine build prerequisites
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib mingw-w64 flex bison \
            python3 git pkg-config libfreetype-dev libfreetype-dev:i386 \
            libunwind-dev libx11-dev libx11-dev:i386 libgtk-4-dev \
            desktop-file-utils curl file xvfb

      - name: Fetch exact GE-Proton11-7 Wine source
        run: |
          git clone --filter=blob:none https://github.com/ValveSoftware/wine.git wine
          cd wine
          git checkout 46b29104e3741fe23bf5e2547196a253aab88c89
          autoreconf -fiv
          (cd dlls/winevulkan && ./make_vulkan)
          ./tools/make_requests
          ./tools/make_specfiles
          test -s include/wine/vulkan.h
          test -s dlls/ntdll/ntsyscalls.h
          test -s include/wine/server_protocol.h
          test -x configure
          git rev-parse HEAD

      - name: Apply Wand CERT_SHA256_HASH_PROP_ID fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hdr = Path("wine/include/wincrypt.h")
          cert = Path("wine/dlls/crypt32/cert.c")
          h = hdr.read_text()
          c = cert.read_text()

          if "#define CERT_SHA256_HASH_PROP_ID" not in h:
              needle = "#define CERT_SIGN_HASH_CNG_ALG_PROP_ID             89\n"
              if needle not in h:
                  raise SystemExit("header insertion anchor missing")
              h = h.replace(needle, needle + "#define CERT_SHA256_HASH_PROP_ID                    107\n", 1)

          old = """#define IS_CERT_HASH_PROP_ID(x) \\\n ((x) == CERT_SHA1_HASH_PROP_ID || (x) == CERT_MD5_HASH_PROP_ID || \\\n  (x) == CERT_SIGNATURE_HASH_PROP_ID)"""
          new = """#define IS_CERT_HASH_PROP_ID(x) \\\n ((x) == CERT_SHA1_HASH_PROP_ID || (x) == CERT_MD5_HASH_PROP_ID || \\\n  (x) == CERT_SHA256_HASH_PROP_ID || (x) == CERT_SIGNATURE_HASH_PROP_ID)"""
          if "CERT_SHA256_HASH_PROP_ID || (x) == CERT_SIGNATURE_HASH_PROP_ID" not in h:
              if old not in h:
                  raise SystemExit("IS_CERT_HASH_PROP_ID anchor missing")
              h = h.replace(old, new, 1)

          getter = """        case CERT_SHA256_HASH_PROP_ID:\n            ret = CertContext_GetHashProp(cert, dwPropId, CALG_SHA_256,\n             cert->ctx.pbCertEncoded, cert->ctx.cbCertEncoded, pvData,\n             pcbData);\n            break;\n"""
          if getter not in c:
              sha1 = """        case CERT_SHA1_HASH_PROP_ID:\n            ret = CertContext_GetHashProp(cert, dwPropId, CALG_SHA1,\n             cert->ctx.pbCertEncoded, cert->ctx.cbCertEncoded, pvData,\n             pcbData);\n            break;\n"""
              if sha1 not in c:
                  raise SystemExit("SHA1 getter anchor missing")
              c = c.replace(sha1, sha1 + getter, 1)

          if "case CERT_SHA256_HASH_PROP_ID:" not in c[c.find("static BOOL CertContext_SetProperty"):]:
              setter_anchor = "        case CERT_MD5_HASH_PROP_ID:\n"
              setter_pos = c.find(setter_anchor, c.find("static BOOL CertContext_SetProperty"))
              if setter_pos < 0:
                  raise SystemExit("setter blob allowlist anchor missing")
              setter_pos += len(setter_anchor)
              c = c[:setter_pos] + "        case CERT_SHA256_HASH_PROP_ID:\n" + c[setter_pos:]

          hdr.write_text(h)
          cert.write_text(c)
          PY
          grep -n "CERT_SHA256_HASH_PROP_ID" wine/include/wincrypt.h wine/dlls/crypt32/cert.c

      - name: Configure and build x86_64 crypt32
        run: |
          mkdir build64
          cd build64
          ../wine/configure --enable-win64 --without-x --without-wayland --without-gstreamer --without-ffmpeg --without-oss --without-pulse --without-alsa
          make -j2 dlls/crypt32/x86_64-windows/crypt32.dll
          test -s dlls/crypt32/x86_64-windows/crypt32.dll
          file dlls/crypt32/x86_64-windows/crypt32.dll
          sha256sum dlls/crypt32/x86_64-windows/crypt32.dll

      - name: Configure and build i386 crypt32
        run: |
          mkdir build32
          cd build32
          ../wine/configure --with-wine64=../build64 --without-x --without-wayland --without-gstreamer --without-ffmpeg --without-oss --without-pulse --without-alsa
          make -j2 dlls/crypt32/i386-windows/crypt32.dll
          test -s dlls/crypt32/i386-windows/crypt32.dll
          file dlls/crypt32/i386-windows/crypt32.dll
          sha256sum dlls/crypt32/i386-windows/crypt32.dll

      - name: Stage payload
        run: |
          mkdir -p payload/x86_64-windows payload/i386-windows
          cp build64/dlls/crypt32/x86_64-windows/crypt32.dll payload/x86_64-windows/crypt32.dll
          cp build32/dlls/crypt32/i386-windows/crypt32.dll payload/i386-windows/crypt32.dll
          sha256sum payload/*/crypt32.dll | tee payload/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: wand-crypt32-payload
          path: payload/
          if-no-files-found: error

      - name: Build native Wand Native GUI
        run: |
          set -euxo pipefail
          gcc -O2 -Wall -Wextra -o wand-native-rc4/wand-native \
            wand-native-rc4/gui.c $(pkg-config --cflags --libs gtk4)
          chmod +x wand-native-rc4/wand-native-helper wand-native-rc4/proton-wrapper
          bash -n wand-native-rc4/wand-native-helper
          bash -n wand-native-rc4/proton-wrapper
          file wand-native-rc4/wand-native

      - name: Stage AppDir
        run: |
          set -euxo pipefail
          APPDIR="$GITHUB_WORKSPACE/WandNative.AppDir"
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/lib/wand-native/payload/x86_64-windows" \
            "$APPDIR/usr/lib/wand-native/payload/i386-windows" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/scalable/apps" \
            "$APPDIR/usr/share/licenses/wand-native"

          cp wand-native-rc4/wand-native "$APPDIR/usr/bin/wand-native"
          cp wand-native-rc4/wand-native-helper "$APPDIR/usr/lib/wand-native/wand-native-helper"
          cp wand-native-rc4/proton-wrapper "$APPDIR/usr/lib/wand-native/proton-wrapper"
          cp payload/x86_64-windows/crypt32.dll "$APPDIR/usr/lib/wand-native/payload/x86_64-windows/crypt32.dll"
          cp payload/i386-windows/crypt32.dll "$APPDIR/usr/lib/wand-native/payload/i386-windows/crypt32.dll"
          cp payload/SHA256SUMS "$APPDIR/usr/lib/wand-native/payload/SHA256SUMS"
          cp wine/COPYING.LIB "$APPDIR/usr/share/licenses/wand-native/WINE-LGPL-2.1.txt"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          HERE="$(cd -- "$(dirname -- "$0")" && pwd -P)"
          export WAND_APPDIR="$HERE"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/wand-native" "$@"
          EOF
          chmod 0755 "$APPDIR/AppRun" "$APPDIR/usr/bin/wand-native" \
            "$APPDIR/usr/lib/wand-native/wand-native-helper" \
            "$APPDIR/usr/lib/wand-native/proton-wrapper"

          cat > "$APPDIR/dev.wand.WandNative.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Wand Native
          Comment=Launch Wand and Steam games together through Proton
          Exec=wand-native
          Icon=wand-native
          Categories=Game;Utility;
          Terminal=false
          StartupNotify=true
          EOF
          cp "$APPDIR/dev.wand.WandNative.desktop" "$APPDIR/usr/share/applications/dev.wand.WandNative.desktop"

          cat > "$APPDIR/wand-native.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="56" fill="#171a1f"/>
            <path d="M55 70l35 125 38-82 38 82 35-125h-30l-18 70-31-69-31 69-18-70z" fill="#ffffff"/>
          </svg>
          EOF
          cp "$APPDIR/wand-native.svg" "$APPDIR/usr/share/icons/hicolor/scalable/apps/wand-native.svg"
          desktop-file-validate "$APPDIR/dev.wand.WandNative.desktop"

      - name: Build AppImage
        run: |
          set -euxo pipefail
          TOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl -fL --retry 3 -o "$TOOL" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $TOOL" | sha256sum -c -
          chmod +x "$TOOL"
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$TOOL" WandNative.AppDir
          built="$(find . -maxdepth 2 -type f -name 'Wand_Native*.AppImage' -o -name 'Wand-Native*.AppImage' | head -1)"
          if [[ -z "$built" ]]; then
            built="$(find . -maxdepth 2 -type f -name '*.AppImage' ! -path "$TOOL" | head -1)"
          fi
          test -n "$built"
          mv "$built" dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage
          chmod +x dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage
          sha256sum dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage > \
            dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage.sha256

      - name: Validate packaged AppImage
        run: |
          set -euxo pipefail
          IMAGE=dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage
          rm -rf squashfs-root
          "$IMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/wand-native
          test -x squashfs-root/usr/lib/wand-native/wand-native-helper
          test -x squashfs-root/usr/lib/wand-native/proton-wrapper
          test -s squashfs-root/usr/lib/wand-native/payload/x86_64-windows/crypt32.dll
          test -s squashfs-root/usr/lib/wand-native/payload/i386-windows/crypt32.dll
          grep -q WAND_NATIVE_BATCH_ACTIVE squashfs-root/usr/lib/wand-native/proton-wrapper
          timeout 5s xvfb-run -a env WAND_APPDIR="$PWD/squashfs-root" \
            squashfs-root/usr/bin/wand-native || rc=$?
          test "${rc:-124}" = "124"

      - name: End-to-end fake Steam validation
        run: |
          set -euxo pipefail
          FAKE="$RUNNER_TEMP/wand-fake"
          HOME_FAKE="$FAKE/home"
          STEAM="$HOME_FAKE/.local/share/Steam"
          BASE="$STEAM/compatibilitytools.d/Proton-GE Latest"
          PREFIX="$STEAM/steamapps/compatdata/2713000/pfx"
          rm -rf "$FAKE"
          mkdir -p \
            "$BASE/files/lib/wine/x86_64-windows" \
            "$BASE/files/lib/wine/i386-windows" \
            "$STEAM/config" \
            "$STEAM/steamapps" \
            "$PREFIX/drive_c/users/test/AppData/Local/Wand/app-12.55.0"

          cat > "$BASE/proton" <<'EOF'
          #!/usr/bin/env bash
          printf '%q ' "$@" >> "${HOME}/fake-proton-args.txt"
          printf '\n' >> "${HOME}/fake-proton-args.txt"
          exit 0
          EOF
          chmod +x "$BASE/proton"
          printf original64 > "$BASE/files/lib/wine/x86_64-windows/crypt32.dll"
          printf original32 > "$BASE/files/lib/wine/i386-windows/crypt32.dll"

          cat > "$STEAM/steamapps/appmanifest_2713000.acf" <<'EOF'
          "AppState"
          {
            "appid" "2713000"
            "name" "Resonance: A Plague Tale Legacy"
            "installdir" "Resonance A Plague Tale Legacy"
          }
          EOF

          cat > "$STEAM/config/config.vdf" <<'EOF'
          "InstallConfigStore"
          {
            "Software"
            {
              "Valve"
              {
                "Steam"
                {
                  "CompatToolMapping"
                  {
                    "2713000"
                    {
                      "name" "GE-Proton-Wand-SHA256"
                      "config" ""
                      "priority" "250"
                    }
                  }
                }
              }
            }
          }
          EOF

          : > "$PREFIX/drive_c/users/test/AppData/Local/Wand/app-12.55.0/Wand.exe"

          export HOME="$HOME_FAKE"
          export XDG_STATE_HOME="$HOME_FAKE/.local/state"
          export XDG_CACHE_HOME="$HOME_FAKE/.cache"
          export WAND_APPDIR="$GITHUB_WORKSPACE/squashfs-root"
          HELPER="$WAND_APPDIR/usr/lib/wand-native/wand-native-helper"

          "$HELPER" games | tee "$FAKE/games.txt"
          grep -Fq "2713000" "$FAKE/games.txt"
          grep -Fq "Resonance: A Plague Tale Legacy" "$FAKE/games.txt"

          "$HELPER" setup 2713000 | tee "$FAKE/setup.txt"
          grep -q "SETUP COMPLETE" "$FAKE/setup.txt"
          "$HELPER" verify 2713000 | tee "$FAKE/verify.txt"
          grep -q "VERIFY COMPLETE" "$FAKE/verify.txt"

          TOOL="$STEAM/compatibilitytools.d/GE-Proton-Wand-SHA256"
          test -x "$TOOL/proton"
          test -x "$TOOL/proton.wand-real"
          grep -q WAND_NATIVE_BATCH_ACTIVE "$TOOL/proton"
          cmp "$WAND_APPDIR/usr/lib/wand-native/payload/x86_64-windows/crypt32.dll" \
              "$TOOL/files/lib/wine/x86_64-windows/crypt32.dll"
          cmp "$WAND_APPDIR/usr/lib/wand-native/payload/i386-windows/crypt32.dll" \
              "$TOOL/files/lib/wine/i386-windows/crypt32.dll"

          mkdir -p "$STEAM/steamapps/common/Test Game"
          : > "$STEAM/steamapps/common/Test Game/Game.exe"
          STEAM_COMPAT_DATA_PATH="$STEAM/steamapps/compatdata/2713000" \
          SteamAppId=2713000 SteamGameId=2713000 STEAM_COMPAT_APP_ID=2713000 \
            "$TOOL/proton" waitforexitandrun "$STEAM/steamapps/common/Test Game/Game.exe" --fake-arg

          grep -q "waitforexitandrun" "$HOME_FAKE/fake-proton-args.txt"
          grep -q "appid-2713000-launch.bat" "$HOME_FAKE/fake-proton-args.txt"
          BATCH="$XDG_STATE_HOME/wand/appid-2713000-launch.bat"
          test -s "$BATCH"
          grep -q "Wand.exe" "$BATCH"
          grep -q "Game.exe" "$BATCH"
          grep -q -- "--fake-arg" "$BATCH"
          echo "FAKE STEAM END-TO-END: PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: Wand-Native-0.1.41-native-gui-rc4-x86_64
          path: |
            dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage
            dist/Wand-Native-0.1.41-native-gui-rc4-x86_64.AppImage.sha256
          if-no-files-found: error
